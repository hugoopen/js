<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookSpace - Biblioteca Digital</title>

    <link rel="stylesheet" href="/DOM2/BookSpace/css/style.css">
    <script src="/DOM2/BookSpace/js/script.js" defer></script>
</head>
<body>

    <header>
        <div>
            <h1>📚 BookSpace</h1>
            <p>Sua biblioteca digital</p>
        </div>

        <button id="btnTema">Alterar tema</button>
    </header>

    <main>

        <!-- Indicadores da biblioteca -->

        <section class="indicadores">

            <div class="indicador">
                <h3>Total de livros</h3>
                <span id="totalLivros">0</span>
            </div>

            <div class="indicador">
                <h3>Disponíveis</h3>
                <span id="totalDisponiveis">0</span>
            </div>

            <div class="indicador">
                <h3>Emprestados</h3>
                <span id="totalEmprestados">0</span>
            </div>

        </section>

        <!-- Pesquisa e filtros -->

        <section class="pesquisa">

            <h2>Explore nosso acervo</h2>

            <div class="filtros">

                <input type="text"
                       id="campoPesquisa"
                       placeholder="Pesquisar título ou autor">

                <select id="filtroCategoria">
                    <option value="">Todas as categorias</option>
                    <option value="Programação">Programação</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Literatura">Literatura</option>
                </select>

            </div>

        </section>

        <!-- Mensagens do sistema -->

        <p id="mensagem" aria-live="polite">
            Carregando biblioteca...
        </p>

        <!-- Os livros serão inseridos pelo JavaScript -->

        <section id="listaLivros"></section>

        <!-- Cadastro de livros -->

        <section class="cadastro">

            <h2>Cadastrar novo livro</h2>

            <label for="titulo">Título</label>
            <input type="text" id="titulo"
                   placeholder="Título do livro">

            <label for="autor">Autor</label>
            <input type="text" id="autor"
                   placeholder="Nome do autor">

            <label for="categoria">Categoria</label>
            <select id="categoria">
                <option value="Programação">Programação</option>
                <option value="Tecnologia">Tecnologia</option>
                <option value="Literatura">Literatura</option>
            </select>

            <label for="ano">Ano de publicação</label>
            <input type="number" id="ano"
                   placeholder="Ex: 2020" min="1">

            <button id="btnCadastrar">
                Cadastrar livro
            </button>

        </section>

    </main>

    <footer>
        <p>BookSpace | Biblioteca Digital</p>
    </footer>

</body>
</html>
